# Illumina Infinium MethylationEPIC / 450K array processing (episignature standard).
# R/Bioconductor stack; used only when array IDATs are the input (`--mode array`).
#
# NOTE on the solver: mixing `sesame` (tracks the newest R) with the older
# annotation/data packages can be unsolvable on some platforms (notably osx-64 /
# Apple-Silicon-under-Rosetta, where a few annotation builds pin an old r-base).
# sesame is used ONLY for the optional hg38 coordinate remap, and epic_process.R
# falls back gracefully without it — so it is kept OPTIONAL below. Install it into
# this env if the solver allows on your platform (linux-64 HPC usually resolves it):
#   mamba install -n methylforge-array -c conda-forge -c bioconda bioconductor-sesame bioconductor-sesamedata
name: methylforge-array
channels: [conda-forge, bioconda]
dependencies:
  - r-base>=4.3
  - bioconductor-minfi
  # EPIC + 450K manifests / annotations (probe -> coordinate)
  - bioconductor-illuminahumanmethylationepicmanifest
  - bioconductor-illuminahumanmethylationepicanno.ilm10b4.hg19
  - bioconductor-illuminahumanmethylation450kmanifest
  - bioconductor-illuminahumanmethylation450kanno.ilmn12.hg19
  # bundled example 450K IDATs for the self-test (test/test_array_hpc.sh)
  - bioconductor-minfidata
  # ---- OPTIONAL add-ons (install separately if the solver allows) ----
  # - bioconductor-sesame        # hg38 coordinate remap (else manifest is hg19)
  # - bioconductor-sesamedata
  # - bioconductor-conumee       # CNV from array intensities
