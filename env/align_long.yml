# Long-read native 5mC (Nanopore / PacBio). Basecalling with modified-base models
# (ONT `dorado`) is done UPSTREAM (GPU) and is distributed by ONT separately, not via
# conda; MethylForge takes the modBAM (MM/ML tags) or FASTQ as input and does
# alignment + methylation pileup here.
name: methylforge-align-long
channels: [conda-forge, bioconda]
dependencies:
  - minimap2=2.28
  - samtools>=1.21
  - ont-modkit            # provides the `modkit` binary (ONT methylation pileup -> bedMethyl).
                          # NOTE: the old bioconda `modkit` package was renamed to `ont-modkit`.
  - multiqc>=1.25
  # PacBio HiFi 5mC — pb-CpG-tools is distributed by PacBio as a GitHub binary, NOT on
  # bioconda; install separately only if you process PacBio data:
  #   https://github.com/PacificBiosciences/pb-CpG-tools
