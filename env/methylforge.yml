# MethylForge core analysis + report engine (pure Python — solves on linux-64,
# osx-64 and osx-arm64). Apple Silicon: `CONDA_SUBDIR=osx-64 mamba env create`
# is only needed for the heavy-aligner envs, not this one.
name: methylforge
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.7
  - jinja2>=3.1
  - openpyxl>=3.1          # Excel (.xlsx) findings workbooks
  - scikit-learn>=1.3,<1.11   # optional SVM episignature back-end; <1.11 keeps the
                              # calibrated SVC(probability=True) behaviour (deprecated in
                              # sklearn 1.9, removed in 1.11). Nearest-centroid is the
                              # default and needs no sklearn.
  - pip
# After the env is created, install the package from the REPO ROOT:
#   conda activate methylforge && pip install -e .
# (an in-yml `pip: ["-e ."]` is unreliable — conda resolves '.' against env/, not the
#  repo root, so it is intentionally omitted here.)
